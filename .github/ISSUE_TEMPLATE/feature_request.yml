name: Sugerir uma melhoria
description: Proponha uma funcionalidade ou melhoria para o projeto.
title: "[Melhoria]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Que necessidade esta proposta resolve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposta
      description: Descreva o comportamento desejado.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Existem soluções mais simples ou abordagens diferentes?

  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Links, imagens ou exemplos que ajudem a avaliar a proposta.
